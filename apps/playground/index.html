<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Jafari Charts playground: every chart type, interaction and export in one place."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 22v-5M14 22V11M19 22v-8M24 22V8' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Jafari Charts Playground</title>
    <script>
      // Apply the colour theme before the first paint (no light flash in dark mode).
      // Mirrors src/lib/theme.ts: ?theme= wins, then the saved choice, then the OS.
      (function () {
        var pref = new URLSearchParams(location.search).get('theme');
        if (pref !== 'light' && pref !== 'dark') {
          try {
            pref = localStorage.getItem('jc-playground-theme');
          } catch (e) {
            pref = null;
          }
        }
        var dark =
          pref === 'dark' ||
          ((!pref || pref === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
