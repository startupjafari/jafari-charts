<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jafari Charts Playground</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .dark {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #f6f7f9;
        color: #0f172a;
      }
      .dark body,
      body.dark {
        background: #0b0d12;
        color: #f1f5f9;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr));
        gap: 16px;
        padding: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px 16px 12px;
        min-width: 0;
      }
      .dark .card {
        background: #0f1115;
        border-color: #1f2430;
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
      }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }
      nav a {
        font-size: 13px;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
